    # critical
    - GHSA-5gmw-xhrv-c9v3 # tinypool (vitest)
    - GHSA-85c8-ppgw-ccpr # tinypool (vitest)
    - GHSA-pqg4-j6r4-53mv # shell-quote
    - GHSA-8r5x-fm3f-whwj # handlebars (mobile tooling)
    - GHSA-p8wg-vrv2-v86f # handlebars (mobile tooling)
    # high
    - GHSA-jm63-cq47-j5jp # @modelcontextprotocol/server (local-hub)
    - GHSA-46jr-4wx8-v453 # @modelcontextprotocol/server (local-hub)
    - GHSA-q3jh-wrc6-jgq8 # follow-redirects (mobile)
