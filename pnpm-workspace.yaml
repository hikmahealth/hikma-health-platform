packages:
  - "apps/*"
  - "packages/*"
  - "packages/utils/*"
  - "vendor/*"
  - "vendor/@*/*"
  - database

# pnpm 11 reads settings only from here: the package.json "pnpm" field is
# ignored outright, and .npmrc is limited to auth/registry settings.
nodeLinker: hoisted

allowBuilds:
  "@sentry/cli": true
  "@swc/core": true
  bcrypt: true
  esbuild: true
  unrs-resolver: true
  # Blocked under pnpm 10 as well (they were absent from onlyBuiltDependencies).
  # lefthook's git hooks are installed by the workspace `prepare` scripts instead.
  "@biomejs/biome": false
  lefthook: false
  '@parcel/watcher': true

# CVE pins on transitive dependencies. pnpm 11 drops these silently if they
# are left in package.json#pnpm, reverting the tree to vulnerable versions.
overrides:
  # Not a CVE pin. @react-native/jest-preset@0.86 and jest-expo@57 still declare
  # jest 29 dependencies, so pnpm nests jest-environment-node@29 under the RN
  # preset. Its ModuleMocker comes from jest-mock@29, which has no
  # clearMocksOnScope — a method jest-runtime@30.4.2 calls on every resetModules,
  # so every suite dies with "Test suite failed to run". Pin to the exact version
  # jest-runtime depends on (it pins jest-mock/@jest/environment to 30.4.1) so
  # pnpm dedupes to the hoisted copy instead of nesting a second one.
  jest-environment-node: 30.4.1
  "esbuild@<=0.24.2": ">=0.25.0"
  "@babel/runtime@<7.26.10": ">=7.26.10"
  "@tootallnate/once@<3.0.1": ">=3.0.1"
  "file-type@>=13.0.0 <21.3.1": ">=21.3.1"
  "file-type@>=20.0.0 <=21.3.1": ">=21.3.2"
  "srvx@<0.11.13": ">=0.11.13"

# Advisories already present when the CI audit gate landed (2026-10-21).
