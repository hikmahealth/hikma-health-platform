services:
  # - type: web
  #   name: 'hikma-health-admin'
  #   runtime: node
  #   buildCommand: npm run build
  #   startCommand: npm run start
  #   envVars:
  #     - key: HIKMA_API
  #       value: "VALUE_HERE"
  #
  # NOTE: hikma-health-aiproxy lives in aiproxy.render.yaml as a separate
  # blueprint. Apply this file first (creates the database), then apply
  # aiproxy.render.yaml if you want the AI proxy deployed.

  - type: web
    name: "hikma-health-server"
    runtime: node
    # Uncomment if you want to deploy to the free tier first.
    # NOTE: free tier has degraded performance making it unusable in real world settings
    # plan: free
    buildCommand: pnpm install --filter "hikma-health-server..." && pnpm run server:build
    startCommand: pnpm run server:start
    buildFilter:
      ignoredPaths:
        - apps/mobile/**
        - apps/aiproxy/**
        - apps/local-hub/**
        - crates/** # Igore any rust crates to avoid building them in render instances
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hikma-health-db
          property: connectionString
      - key: DATABASE_SSL_OPTIONS
        value: '{"rejectUnauthorized":false}'
      # Unlocks the first-run /setup page; copy it from the Environment tab.
      # Ignored once setup is complete.
      - key: SETUP_TOKEN
        generateValue: true

databases:
  - name: "hikma-health-db"
    # Uncomment this line to use the free tier of the database
    # NOTE: FREE DATABASES ARE DELETED AFTER 90 DAYS!!! Remember NEVER to use a free database after for real patient data.
    # plan: free
    databaseName: hhdb
    user: hikma
    # highAvailability:
    # enabled: true
# Define any additional services or database configurations if needed
